name: plugin-concursos

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db:3306
  WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
  WORDPRESS_DB_USER: ${DB_USER:-wordpress}
  WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-wordpress}
  WORDPRESS_DEBUG: 1
  WORDPRESS_CONFIG_EXTRA: |
    define( 'WP_DEBUG_LOG', true );
    define( 'WP_DEBUG_DISPLAY', true );
    define( 'SCRIPT_DEBUG', true );
    define( 'WP_ENVIRONMENT_TYPE', 'local' );

x-wp-volumes: &wp-volumes
  - wordpress:/var/www/html
  - .:/var/www/html/wp-content/plugins/photo-challenges
  - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment: *wp-env
    volumes:
      - wordpress:/var/www/html
      - .:/var/www/html/wp-content/plugins/photo-challenges
      - ./docker/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  phpmyadmin:
    image: phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:-root}

  # Buzón de pruebas: captura todos los emails que envía WordPress.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  # Uso: docker compose run --rm wpcli <comando>   (ej: plugin list)
  wpcli:
    image: wordpress:cli
    profiles: ["cli"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *wp-env
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    volumes: *wp-volumes
    entrypoint: ["wp"]

volumes:
  db:
  wordpress:
